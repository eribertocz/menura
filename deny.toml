# Dependency policy, checked by `cargo deny check` (spec/09-continuous-integration.md CI-1 `dependencies`).
# Changes require the maintainer's approval (CODEOWNERS).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses compatible with Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# A1: dependency allowlist. Only the crates listed here may appear in the dependency graph.
# A new dependency is added here only with the maintainer's approval (AGENTS.md section 4).
allow = [
    "semantic-compiler-contracts",
    "semantic-compiler-model",
    "semantic-compiler-security",
    "semantic-compiler-e0-load",
    "semantic-compiler-e1-parse",
    "semantic-compiler-e2-bind",
    "semantic-compiler-e3-paths",
    "semantic-compiler-e4-plan",
    "semantic-compiler-e5-optimize",
    "semantic-compiler-generator-duckdb",
    "semantic-compiler-core",
    "semantic-compiler-cli",
    "semantic-compiler-conformance-runner",
    # Approved by the maintainer for the conformance runner only (#6).
]
# A2: network, filesystem, clock and database libraries are banned in every crate except the
# command-line wrapper and the conformance runner, the only crates allowed to depend on them
# directly. No crate may depend on the conformance runner (dependency-graph check). cargo-deny
# reports each exemption as an `unused-wrapper` warning until the wrapper uses that crate.
deny = [
    # Network
    { crate = "reqwest", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "hyper", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "ureq", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "curl", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "isahc", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "surf", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "attohttpc", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tokio", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "async-std", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mio", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "socket2", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tungstenite", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "native-tls", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "rustls", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "openssl", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    # Filesystem
    { crate = "walkdir", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tempfile", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "notify", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "fs-err", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "fs_extra", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "glob", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
