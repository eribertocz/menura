    "semantic-compiler-generator-duckdb",
    "semantic-compiler-core",
    "semantic-compiler-cli",
    "semantic-compiler-conformance-runner",
    # Contracts (#5): JSON (de)serialization and the SHA-256 of CON-2, with their dependencies.
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "itoa",
    "memchr",
    "zmij",
