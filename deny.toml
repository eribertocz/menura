# A2: network, filesystem, clock and database libraries are banned in every crate except the
# command-line wrapper and the conformance runner, the only crates allowed to depend on them
# directly. No crate may depend on the conformance runner (dependency-graph check). cargo-deny
# reports each exemption as an `unused-wrapper` warning until the wrapper uses that crate.
deny = [
    # Network
    { crate = "reqwest", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "hyper", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "ureq", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner", "libduckdb-sys"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "curl", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "isahc", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
