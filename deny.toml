    { crate = "humantime", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "coarsetime", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "quanta", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    # Database
    { crate = "duckdb", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "libduckdb-sys", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
