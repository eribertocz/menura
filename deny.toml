    { crate = "sqlx", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "diesel", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "postgres", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tokio-postgres", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mysql", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
