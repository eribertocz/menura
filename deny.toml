    { crate = "redis", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "odbc-api", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
