    { crate = "directories", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    # Clock
    { crate = "chrono", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
