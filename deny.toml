    { crate = "tokio", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "async-std", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mio", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "socket2", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tungstenite", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "native-tls", wrappers = ["semantic-compiler-cli", "semantic-compiler-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
