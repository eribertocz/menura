    # YAML event parser, also approved by the maintainer for the model reader of e0-load (#28).
    "granit-parser",
    "half",
    "hashbrown",
    "hashlink",
    "heck",
    "hybrid-array",
    "iana-time-zone",
    "iana-time-zone-haiku",
