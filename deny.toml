# A2: network, filesystem, clock and database libraries are banned in every crate except the
# command-line wrapper and the conformance runner, the only crates allowed to depend on them
# directly. No crate may depend on the conformance runner (dependency-graph check). cargo-deny
# reports each exemption as an `unused-wrapper` warning until the wrapper uses that crate.
deny = [
    # Network
    { crate = "reqwest", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "hyper", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "ureq", wrappers = ["menura-cli", "menura-conformance-runner", "libduckdb-sys"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "curl", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "isahc", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "surf", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "attohttpc", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tokio", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "async-std", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mio", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "socket2", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tungstenite", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "native-tls", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "rustls", wrappers = ["menura-cli", "menura-conformance-runner", "ureq"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "openssl", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: network access is forbidden outside the command-line wrapper and the conformance runner" },
    # Filesystem
    { crate = "walkdir", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tempfile", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "notify", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "fs-err", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "fs_extra", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "glob", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "globwalk", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "ignore", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "memmap2", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "dirs", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "directories", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: filesystem access is forbidden outside the command-line wrapper and the conformance runner" },
    # Clock
    # Arrow, which brings chrono: only inside the DuckDB tree of the conformance runner (#6).
    { crate = "arrow", wrappers = ["duckdb"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-arith", wrappers = ["arrow"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-array", wrappers = ["arrow", "arrow-arith", "arrow-cast", "arrow-cmp", "arrow-ord", "arrow-row", "arrow-select", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-buffer", wrappers = ["arrow", "arrow-arith", "arrow-array", "arrow-cast", "arrow-cmp", "arrow-data", "arrow-ord", "arrow-row", "arrow-select", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-cast", wrappers = ["arrow"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-cmp", wrappers = ["arrow-ord", "arrow-select"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-data", wrappers = ["arrow", "arrow-arith", "arrow-array", "arrow-cast", "arrow-ord", "arrow-row", "arrow-select", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-ord", wrappers = ["arrow", "arrow-cast"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-row", wrappers = ["arrow"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-schema", wrappers = ["arrow", "arrow-arith", "arrow-array", "arrow-cast", "arrow-cmp", "arrow-data", "arrow-ord", "arrow-row", "arrow-select", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-select", wrappers = ["arrow", "arrow-cast", "arrow-ord", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-string", wrappers = ["arrow"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "chrono", wrappers = ["menura-cli", "menura-conformance-runner", "arrow-arith", "arrow-array", "arrow-cast"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "time", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "jiff", wrappers = ["menura-cli", "menura-conformance-runner", "menura-e1-parse"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner; menura-e1-parse may use it only without the `std` feature, which has no clock API (#229)" },
    { crate = "humantime", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "coarsetime", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "quanta", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: clock access is forbidden outside the command-line wrapper and the conformance runner" },
    # Database
    { crate = "duckdb", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "libduckdb-sys", wrappers = ["menura-cli", "menura-conformance-runner", "duckdb"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "rusqlite", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "libsqlite3-sys", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "sqlx", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "diesel", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "postgres", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "tokio-postgres", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mysql", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
    { crate = "mongodb", wrappers = ["menura-cli", "menura-conformance-runner"], reason = "A2: database access is forbidden outside the command-line wrapper and the conformance runner" },
