# Dependency policy, checked by `cargo deny check` (spec/09-continuous-integration.md CI-1 `dependencies`).
# Changes require the maintainer's approval (CODEOWNERS).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (informational, no patched version). It reaches only the test-tooling crate conformance-runner, through duckdb's arrow; no compiler crate depends on it, and the chrono ban keeps it that way (A2). Remove when duckdb/arrow stop depending on chrono." },
]

[licenses]
version = 2
# Licenses compatible with Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# CC0-1.0 is allowed for this one crate only: a build dependency of DuckDB, which only the
# conformance runner uses (#6, ARC-5.3).
exceptions = [
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # CDLA-Permissive-2.0 is allowed for this one crate only: the root certificates of the
    # build-time download of the prebuilt DuckDB library, which only the conformance runner uses
    # (#46, ARC-5.3).
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# DuckDB brings its own versions of crates the compiler also uses (sha2, syn, getrandom, ...).
# Duplicates are tolerated below DuckDB only, which only the conformance runner uses (ARC-5.3).
skip-tree = [
    { crate = "duckdb@1.20000.2", reason = "test tooling only (ARC-5.3); its dependency tree is not part of the compiler" },
]
# A1: dependency allowlist. Only the crates listed here may appear in the dependency graph.
# A new dependency is added here only with the maintainer's approval (AGENTS.md section 4).
allow = [
    "menura-contracts",
    "menura-model",
    "menura-expressions",
    "menura-representations",
    "menura-security",
    "menura-e0-load",
    "menura-e1-parse",
    "menura-e2-bind",
    "menura-e3-paths",
    "menura-e4-plan",
    "menura-e5-optimize",
    "menura-generator-duckdb",
    "menura-core",
    "menura-cli",
    "menura-python",
    "menura-mcp",
    "menura-conformance-runner",
    # Contracts (#5): JSON (de)serialization and the SHA-256 of CON-2, with their dependencies.
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "itoa",
    "memchr",
    "zmij",
    "proc-macro2",
    "quote",
    "syn",
    "unicode-ident",
    "sha2",
    "digest",
    "block-buffer",
    "crypto-common",
    "generic-array",
    "typenum",
    "version_check",
    "cfg-if",
    "cpufeatures",
    "libc",
    # Python package (#516, ARC-6.3), approved by the maintainer on 2026-11-22 for menura-python
    # only: PyO3, allowed at its exact version only, and the crates it is made of. Its build
    # configuration reads the target with `target-lexicon`; the rest of its tree is listed above.
    "pyo3@=0.30.1",
    "pyo3-build-config@=0.30.1",
    "pyo3-ffi@=0.30.1",
    "pyo3-macros@=0.30.1",
    "pyo3-macros-backend@=0.30.1",
    "target-lexicon",
    # E1 (#229), approved by the maintainer for menura-e1-parse only: the bundled IANA time-zone
    # database of E1-2.3. `jiff` is banned below with `menura-e1-parse` among its wrappers, and is
    # built without its `std` feature, so it has no clock API (A2); allowed here at its exact
    # version only (cargo-deny rejects the same entry in both).
    "jiff@=1.0.1",
    "jiff-core",
    "jiff-tzdb",
    # `jiff` dependencies only on targets without pointer-sized atomics, never built on ours;
    # cargo-deny sees them because it checks every target (#229).
    "portable-atomic",
    "portable-atomic-util",
    # Conformance runner (#6, ARC-5.3), approved by the maintainer for that crate only: DuckDB
    # (bundled), the serde-saphyr YAML parser, and their dependencies. `duckdb`, `libduckdb-sys` and
    # `chrono` are banned below with the runner (and DuckDB's own crates) as their only wrappers;
    # here they are allowed at their exact version only (cargo-deny rejects the same entry in both).
    "chrono@=0.4.45",
    "duckdb@=1.20000.2",
    "libduckdb-sys@=1.20000.2",
    # The `arrow` crates are banned below with their parents inside DuckDB's tree as their only
    # wrappers, so `chrono` (A2) is never reachable outside it; allowed here at their exact version.
    "arrow@=60.1.0",
    "arrow-arith@=60.1.0",
    "arrow-array@=60.1.0",
    "arrow-buffer@=60.1.0",
    "arrow-cast@=60.1.0",
    "arrow-cmp@=60.1.0",
    "arrow-data@=60.1.0",
    "arrow-ord@=60.1.0",
