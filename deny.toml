    { crate = "arrow-schema", wrappers = ["arrow", "arrow-arith", "arrow-array", "arrow-cast", "arrow-cmp", "arrow-data", "arrow-ord", "arrow-row", "arrow-select", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
    { crate = "arrow-select", wrappers = ["arrow", "arrow-cast", "arrow-ord", "arrow-string"], reason = "A2: reaches the clock (chrono); allowed only inside the DuckDB tree of the conformance runner (ARC-5.3)" },
