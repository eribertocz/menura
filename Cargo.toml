[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/model",
    "crates/expressions",
    "crates/representations",
    "crates/security",
    "crates/e0-load",
    "crates/e1-parse",
    "crates/e2-bind",
    "crates/e3-paths",
    "crates/e4-plan",
    "crates/e5-optimize",
    "crates/generator-duckdb",
    "crates/core",
    "crates/cli",
    "crates/python",
    "crates/mcp",
    "crates/conformance-runner",
    "crates/benchmarks",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
menura-contracts = { path = "crates/contracts" }
menura-model = { path = "crates/model" }
menura-expressions = { path = "crates/expressions" }
menura-representations = { path = "crates/representations" }
menura-security = { path = "crates/security" }
menura-e0-load = { path = "crates/e0-load" }
menura-e1-parse = { path = "crates/e1-parse" }
menura-e2-bind = { path = "crates/e2-bind" }
menura-e3-paths = { path = "crates/e3-paths" }
menura-e4-plan = { path = "crates/e4-plan" }
menura-e5-optimize = { path = "crates/e5-optimize" }
menura-generator-duckdb = { path = "crates/generator-duckdb" }
menura-core = { path = "crates/core" }
jiff = { version = "1.0.1", default-features = false, features = ["alloc", "tzdb-bundle-always"] }
jiff-tzdb = "1.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
