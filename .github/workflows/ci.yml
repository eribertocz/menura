# Checks of spec/09-continuous-integration.md CI-1 that run on every pull request and every
# push to main (WF-8.0): format, lint, unsafe, test, dependencies, dependency-graph, conformance,
# ossie-suites, rule-coverage, index, examples, agent-smoke, benchmarks and conformance-wrappers.
# Every job is named exactly as its check in CI-1.
#
# Tool versions are pinned so that the same commit always gets the same verdict.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Check formatting (Q3)
        run: cargo fmt --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Run clippy with every warning denied (Q2, Q3, Q4, Q7)
        run: cargo clippy --locked --all-targets -- -D warnings

  unsafe:
    name: unsafe
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test the check
        run: python3 -m unittest discover -s scripts/ci -p 'test_unsafe.py' -v
      - name: Check every crate root forbids unsafe code (Q1)
        run: python3 -I scripts/ci/check_unsafe.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Run every test (T2, T5)
        run: cargo test --locked --all-targets

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: Check the allowlist, banned I/O crates, licenses, sources and advisories (A1, A2)
        run: cargo deny --locked check

  dependency-graph:
    name: dependency-graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test the check
        run: python3 -m unittest discover -s scripts/ci -p 'test_dependency_graph.py' -v
      - name: Check dependency direction, cycles and wrappers (S6, S7, S8)
        run: python3 -I scripts/ci/check_dependency_graph.py

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test the runner (CS-2.1, CS-2.2, CS-4.2, CS-4.3)
        run: cargo test --locked -p menura-conformance-runner
      - name: Run every case with non-default DuckDB settings and report per rule ID (CS-4.1, CS-4.2, CS-4.3)
        shell: bash
        run: cargo run --locked --quiet -p menura-conformance-runner -- conformance | tee "$RUNNER_TEMP/conformance-report.txt"
      - name: Describe a model with the built menura binary, for its capability profile (DSC-4, CI-4.3)
        shell: bash
        run: >-
          cargo run --locked --quiet -p menura-cli --bin menura -- describe
          --model conformance/models/dsc-describe/model.yaml
          --catalog-schema conformance/models/dsc-describe/catalog-schema.json
          --security-context conformance/models/dsc-describe/contexts/admin.json
          > "$RUNNER_TEMP/description.json"
      - name: Summarize the run for the compatibility matrix (CI-4.3)
        run: >-
          python3 -I scripts/ci/compatibility_matrix.py summarize conformance
          "$RUNNER_TEMP/conformance-report.txt" "$RUNNER_TEMP/description.json"
          --output "$RUNNER_TEMP/summary/conformance.json"
      - name: Upload the summary for the compatibility matrix (CI-4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-summary-conformance
          path: ${{ runner.temp }}/summary/conformance.json
          if-no-files-found: error

  ossie-suites:
    name: ossie-suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Run the Apache Ossie suites at the tracked commit against expected-failures.yaml (OSS-2.3, OSS-2.4)
        shell: bash
        run: cargo run --locked --quiet -p menura-conformance-runner -- conformance ossie | tee "$RUNNER_TEMP/ossie-report.txt"
      - name: Summarize the run for the compatibility matrix (CI-4.3)
        run: >-
          python3 -I scripts/ci/compatibility_matrix.py summarize ossie-suites
          "$RUNNER_TEMP/ossie-report.txt" --output "$RUNNER_TEMP/summary/ossie-suites.json"
      - name: Upload the summary for the compatibility matrix (CI-4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-summary-ossie-suites
          path: ${{ runner.temp }}/summary/ossie-suites.json
          if-no-files-found: error

  rule-coverage:
    name: rule-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the check's dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check pyyaml==6.0.3
      - name: Test the check
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s scripts/ci -p "test_rule_coverage.py" -v'
      - name: List rule IDs without a case, CI check or review item (T1; fails only for the coverage scope, CS-2.6)
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/ci/check_rule_coverage.py'

  index:
    name: index
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check spec/INDEX.md is up to date
        run: python3 -I scripts/build_index.py --check

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the example checker's dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check jsonschema==4.26.0 pyyaml==6.0.3 rfc3339-validator==0.1.4
      - name: Validate the contract examples against their schemas
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/check_examples.py'
      # The Rust evaluator checks the same corpus in the `test` job (crates/contracts/tests/corpus.rs).
      - name: Validate the contract corpus with the reference implementation
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/check_contract_corpus.py'

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit with its full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the check's dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check jsonschema==4.26.0 pyyaml==6.0.3 rfc3339-validator==0.1.4
      - name: Test the check
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s scripts/ci -p "test_contract_changes.py" -v'
      # A pull request is compared with the merge base of its base branch; a push to main with the previous commit.
      - name: Check every changed schema has a bumped version and a changed example (A3, A5, CON-3)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^1' }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/ci/check_contract_changes.py "$BASE"'

  agent-smoke:
    name: agent-smoke
    runs-on: ubuntu-latest
    # ARC-6.7: the agent smoke test never blocks a release (7.1).
    continue-on-error: true
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test the script
        run: python3 -m unittest discover -s scripts/ci -p 'test_agent_smoke.py' -v
      - name: Build menura-mcp in release
        run: cargo build --locked --release -p menura-mcp
      - name: Drive menura-mcp with the fixed client script (ARC-6.7, PLN-5.4, PLN-5.4a)
        run: python3 -I scripts/ci/agent_smoke.py target/release/menura-mcp

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install Valgrind (R7)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      - name: Test the benchmarks (R1–R7)
        run: cargo test --locked -p menura-benchmarks
      - name: Build the benchmarks
        run: cargo build --locked --release -p menura-benchmarks
      - name: Measure load and compile wall-clock times (R1, R2, R6)
        run: target/release/menura-benchmarks wall-clock
      - name: Count instructions, check the sweep and the baseline (R3, R7)
        run: target/release/menura-benchmarks instructions benchmarks/baseline.json

  conformance-wrappers:
    name: conformance-wrappers
    runs-on: ubuntu-24.04
    env:
      MATURIN_VERSION: "1.16.0"
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test the Python check
        run: python3 -m unittest discover -s scripts/ci -p 'test_wrapper_parity.py' -v
      - name: Build menura, menura-mcp and the parity check in release
        run: cargo build --locked --release --bin menura --bin menura-mcp --bin wrapper-parity
      - name: Create a virtual environment with maturin
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check "maturin==$MATURIN_VERSION"
      - name: Build the Linux x86_64 wheel and install it (ARC-6.3)
        run: |
          "$RUNNER_TEMP/venv/bin/maturin" build --locked --release --manifest-path crates/python/Cargo.toml --out "$RUNNER_TEMP/wheels"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --no-index --find-links "$RUNNER_TEMP/wheels" menura
      - name: Run every case through the CLI and the MCP server, documents identical to core (ARC-6.9, A4)
        run: >-
          target/release/wrapper-parity conformance
          --cli target/release/menura --mcp target/release/menura-mcp
          --manifest "$RUNNER_TEMP/wrapper-parity.json" --work "$RUNNER_TEMP/wrapper-parity"
      - name: Run every case through the Python package, documents identical to core (ARC-6.4, ARC-6.9, A4)
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/ci/check_wrapper_parity.py "$RUNNER_TEMP/wrapper-parity.json"'
      - name: Summarize the run for the compatibility matrix (CI-4.3)
        run: >-
          python3 -I scripts/ci/compatibility_matrix.py summarize conformance-wrappers
          --output "$RUNNER_TEMP/summary/conformance-wrappers.json"
      - name: Upload the summary for the compatibility matrix (CI-4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-summary-conformance-wrappers
          path: ${{ runner.temp }}/summary/conformance-wrappers.json
          if-no-files-found: error

  stubs:
    name: stubs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install the validator of the examples job
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check jsonschema==4.26.0 rfc3339-validator==0.1.4
      - name: Test the stubs
        run: python3 -m unittest discover -s scripts/ci -p 'test_stubs_end_to_end.py' -v
      - name: Build menura in release
        run: cargo build --locked --release --bin menura
      - name: Run menura between the catalog and executor stubs, every document validated (A6)
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/ci/stubs_end_to_end.py target/release/menura'
