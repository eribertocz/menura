id: e3-ambiguous-path-pair-only-001
rules: [E3-3.2, QRY-4.3]
model: e3-path-choice
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["calendar.month", "fiscal_years.label"]
    metrics:
      - {"metric": "total_amount", "alias": "total_amount"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "paths": [{"from": "orders", "to": "calendar", "relationships": ["order_date"]}]}}
expect:
  outcome: "error"
  error: "E_AMBIGUOUS_PATH"
  location: {document: query, pointer: /query/dimensions/1}
