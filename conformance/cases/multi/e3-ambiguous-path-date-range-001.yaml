id: e3-ambiguous-path-date-range-001
rules: [E3-3.2, E3-3.1a]
model: e3-path-choice
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["regions.region_name"]
    metrics:
      - {"metric": "total_amount", "alias": "total_amount"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "date_range": {"dimension": "calendar.day", "from": "2024-01-01", "to": "2024-12-31"}}}
expect:
  outcome: "error"
  error: "E_AMBIGUOUS_PATH"
  location: {document: query, pointer: /query/nonportable_extensions/0/data/date_range}
