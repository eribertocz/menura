id: e4-stitch-member-one-branch-001
rules: [E4-5.0a, E4-5.0b, E4-5.1, E4-4.0d]
model: e4-stitch
security_context: analyst.json
oracle: "e4-stitch-member-one-branch-001.oracle.sql"
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["regions.name"]
    metrics:
      - {"metric": "total_sales", "alias": "total_sales"}
      - {"metric": "budget_total", "alias": "budget_total"}
    filter: "regions.name <> 'NORTH'"
expect:
  outcome: "plan"
  row_order: "any"
  rows: "e4-stitch-member-one-branch-001.csv"
