  sql_clickhouse: e5-summary-float-argument-001.clickhouse.sql
  sql: e5-summary-float-argument-001.sql
  rows: e5-summary-float-argument-001.csv
  row_order: any
  tolerance: 1.0e-9
oracle: e5-summary-float-argument-001.oracle.sql
