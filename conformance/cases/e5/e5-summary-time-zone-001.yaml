id: e5-summary-time-zone-001
rules: [E5-4, SUM-3.7, CAT-7.2, CHK-5.3]
model: e5-summary-time-zone
security_context: analyst.json
query:
  contract: menura.query
  contract_version: "1.1.0"
  time_zone: America/Lima
  query:
    dimensions: [orders.order_date]
    metrics:
      - {metric: total_amount, alias: total_amount}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "month"}]}}
expect:
  outcome: plan
  sql: e5-summary-time-zone-001.sql
  rows: e5-summary-time-zone-001.csv
  row_order: any
oracle: e5-summary-time-zone-001.oracle.sql
