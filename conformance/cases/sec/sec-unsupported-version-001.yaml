id: sec-unsupported-version-001
rules: [SEC-3.8]
model: slice
security_context: unsupported-version.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
expect:
  outcome: "error"
  error: "ESEC-03"
  location:
    document: "security_context"
    pointer: "/contract_version"
