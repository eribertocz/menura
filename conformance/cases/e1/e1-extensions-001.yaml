id: e1-extensions-001
rules: [E1-3.3]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.sale_date"]
    metrics:
      - {"metric": "total_quantity", "alias": "total_quantity"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "sales.sale_date", "grain": "month"}], "date_range": {"dimension": "sales.sale_date", "from": "2026-01-01", "to": "2026-02-28"}, "filters": ["sales.channel = 'web'"], "order_by": [{"output": "sale_date", "direction": "desc", "nulls": "last"}], "limit": 1}}
expect:
  outcome: "plan"
  row_order: "exact"
  rows: "e1-extensions-001.csv"
