id: e1-filter-syntax-001
rules: [E1-3.2]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    filter: "sales.quantity >"
expect:
  outcome: "error"
  error: "E0F-01"
  location:
    document: "query"
    pointer: "/query/filter"
