id: next-sql-plan-inline-metric-001
rules: [E1-4.2, E1-4.3]
model: slice
security_context: auditor.json
oracle: "next-sql-plan-inline-metric-001.oracle.sql"
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  sql: "SELECT CAST(AGG(total_amount) AS DOUBLE) / AGG(total_quantity) AS per_unit, region, COALESCE(AGG(sale_count), 0) * 2 AS doubled FROM slice.sales GROUP BY region ORDER BY region"
expect:
  outcome: "plan"
  tolerance: 1e-12
  row_order: "exact"
  rows: "next-sql-plan-inline-metric-001.csv"
