id: e2-grain-on-text-001
rules: [E2-3.4]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "sales.region", "grain": "month"}]}}
expect:
  outcome: "error"
  error: "E2-01"
  location:
    document: "query"
    pointer: "/query/nonportable_extensions/0/data/time_grains/0"
