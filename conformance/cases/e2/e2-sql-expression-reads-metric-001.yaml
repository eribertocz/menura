id: e2-sql-expression-reads-metric-001
rules: [E2-3.3]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  sql: "SELECT sale_count + 1 AS x, AGG(total_amount) AS t FROM slice.sales GROUP BY sale_count + 1"
expect:
  outcome: "error"
  error: "E_METRIC_IN_DIMENSIONS"
  location:
    document: "query"
    pointer: "/sql"
