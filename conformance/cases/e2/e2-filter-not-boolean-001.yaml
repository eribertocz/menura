id: e2-filter-not-boolean-001
rules: [E2-3.6]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    filter: "sales.quantity + 1"
expect:
  outcome: "error"
  error: "E0F-06"
  location:
    document: "query"
    pointer: "/query/filter"
