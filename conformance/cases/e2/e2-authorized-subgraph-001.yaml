id: e2-authorized-subgraph-001
rules: [E2-4.8]
model: slice
security_context: analyst-north.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "paths": [{"from": "sales", "to": "targets", "relationships": ["sales_targets"]}]}}
expect:
  outcome: "error"
  error: "E_NAME_NOT_FOUND"
