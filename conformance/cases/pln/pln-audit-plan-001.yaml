id: pln-audit-plan-001
rules: [CS-2.13, VS-1e, PLN-6, PLN-6.1, PLN-6.2, PLN-6.3, PLN-6.5, PLN-6.6, PLN-6.7, E2-4.7]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "total_amount", "alias": "total_amount"}
      - {"metric": "total_quantity", "alias": "total_quantity"}
      - {"metric": "sale_count", "alias": "sale_count"}
expect:
  outcome: "plan"
  rows: "pln-audit-plan-001.csv"
  row_order: "any"
  audit: "pln-audit-plan-001.audit.json"
