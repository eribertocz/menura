id: pln-lineage-summary-001
rules: [PLN-4.5, PLN-4.6, PLN-4.9]
model: e5-summary-selection
security_context: analyst.json
query:
  contract: menura.query
  contract_version: "1.1.0"
  time_zone: UTC
  query:
    dimensions: [orders.region, orders.order_date]
    metrics:
      - {metric: total_amount, alias: total_amount}
      - {metric: order_count, alias: order_count}
      - {metric: average_amount, alias: average_amount}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "month"}]}}
expect:
  outcome: plan
  sql_clickhouse: pln-lineage-summary-001.clickhouse.sql
  sql: pln-lineage-summary-001.sql
  rows: pln-lineage-summary-001.csv
  row_order: any
  lineage: pln-lineage-summary-001.lineage.json
