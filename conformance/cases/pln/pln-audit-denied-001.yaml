id: pln-audit-denied-001
rules: [CS-2.13, VS-1e, PLN-6, PLN-6.5, PLN-6.6, E2-4.7]
model: slice
security_context: outsider.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "total_amount", "alias": "total_amount"}
      - {"metric": "total_quantity", "alias": "total_quantity"}
      - {"metric": "sale_count", "alias": "sale_count"}
expect:
  outcome: "error"
  error: "E_NAME_NOT_FOUND"
  location: {document: "query", pointer: "/query/dimensions/0"}
  audit: "pln-audit-denied-001.audit.json"
