id: pln-alternatives-dataset-001
rules: [CS-2.17, PLN-5.4]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "paths": [{"from": "sale", "to": "returns", "relationships": ["returns_sales"]}]}}
expect:
  outcome: "error"
  error: "E_NAME_NOT_FOUND"
  alternatives: ["dataset:SALES"]
