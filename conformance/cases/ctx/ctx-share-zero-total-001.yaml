id: ctx-share-zero-total-001
rules: [CTX-3.4, E4-8.3]
model: ctx-share
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["customers.region", "orders.status"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_share_in_region", "alias": "sales_share_in_region"}
    filter: "customers.region = 'WEST'"
expect:
  outcome: "plan"
  sql_clickhouse: ctx-share-zero-total-001.clickhouse.sql
  tolerance: 1e-12
  row_order: "any"
  rows: "ctx-share-zero-total-001.csv"
