id: ctx-prior-week-by-year-001
rules: [E4-8.4, E4-8.6, CTX-3a.2]
model: ctx-prior
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.order_date"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_prior_year", "alias": "sales_prior_year"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "week"}], "date_range": {"dimension": "orders.order_date", "from": "2020-12-28", "to": "2021-01-03"}}}
expect:
  outcome: "plan"
  sql_clickhouse: ctx-prior-week-by-year-001.clickhouse.sql
  sql: "ctx-prior-week-by-year-001.sql"
  row_order: "any"
  rows: "ctx-prior-week-by-year-001.csv"
