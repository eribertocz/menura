id: ctx-to-date-month-by-day-001
rules: [E4-8.5, E4-8.6, E4-3.15, CTX-3a.1]
model: ctx-to-date
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.order_date"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_mtd", "alias": "sales_mtd"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "date_range": {"dimension": "orders.order_date", "from": "2026-01-01", "to": "2026-03-31"}}}
expect:
  outcome: "plan"
  sql_clickhouse: ctx-to-date-month-by-day-001.clickhouse.sql
  row_order: "any"
  rows: "ctx-to-date-month-by-day-001.csv"
