id: ctx-to-date-timestamp-grain-001
rules: [E4-8.5, E4-8.6, E4-3.15, CTX-3.1]
model: ctx-to-date
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.placed_at"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_placed_ytd", "alias": "sales_placed_ytd"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.placed_at", "grain": "quarter"}]}}
expect:
  outcome: "plan"
  clickhouse: e6_01
  row_order: "any"
  rows: "ctx-to-date-timestamp-grain-001.csv"
