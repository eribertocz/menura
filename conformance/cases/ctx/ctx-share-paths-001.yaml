id: ctx-share-paths-001
rules: [E4-8.2, E3-3.3]
model: ctx-share
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["customers.region"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_share_of_regions", "alias": "sales_share_of_regions"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "paths": [{"from": "orders", "to": "customers", "relationships": ["orders_customers"]}]}}
expect:
  outcome: "plan"
  explanation: ["DEV-4", "E3-3.3", "E4-4.0e", "E4-4.1", "E4-8.2", "E5-3.2", "E5-3.3"]
  tolerance: 1e-12
  row_order: "any"
  rows: "ctx-share-paths-001.csv"
