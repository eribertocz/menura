id: ctx-prior-time-twice-001
rules: [E4-02, CTX-3.1, E4-8.6]
model: ctx-prior
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions:
      - {"field": "orders.order_date", "alias": "order_day"}
      - {"field": "orders.order_date", "alias": "order_month"}
    metrics:
      - {"metric": "sales_prior_month", "alias": "sales_prior_month"}
expect:
  outcome: "error"
  error: "E4-02"
  location:
    document: "query"
    pointer: "/query/metrics/0"
