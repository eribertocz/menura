id: ctx-prior-change-on-year-001
rules: [CTX-3.7, E4-8.4]
model: ctx-prior
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.order_date"]
    metrics:
      - {"metric": "sales_change_on_year", "alias": "sales_change_on_year"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "month"}], "date_range": {"dimension": "orders.order_date", "from": "2024-02-01", "to": "2024-03-31"}}}
expect:
  outcome: "plan"
  row_order: "any"
  rows: "ctx-prior-change-on-year-001.csv"
