id: ctx-share-null-group-001
rules: [E4-8.7, E4-4.1]
model: ctx-share
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["customers.region", "orders.status"]
    metrics:
      - {"metric": "order_count", "alias": "order_count"}
      - {"metric": "sales_share_in_region", "alias": "sales_share_in_region"}
    filter: "customers.region IS NULL"
expect:
  outcome: "plan"
  sql_clickhouse: ctx-share-null-group-001.clickhouse.sql
  tolerance: 1e-12
  row_order: "any"
  rows: "ctx-share-null-group-001.csv"
