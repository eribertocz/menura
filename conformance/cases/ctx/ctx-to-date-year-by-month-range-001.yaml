id: ctx-to-date-year-by-month-range-001
rules: [E4-8.1, E4-8.2, E4-8.5, E4-8.6, E4-8.7, E4-3.15, CTX-3a.1, CTX-3.5, VS-1f, E6-4.12, E6-4.14]
model: ctx-to-date
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.order_date"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_ytd", "alias": "sales_ytd"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "month"}], "date_range": {"dimension": "orders.order_date", "from": "2026-03-01", "to": "2026-04-30"}}}
expect:
  outcome: "plan"
  sql_clickhouse: ctx-to-date-year-by-month-range-001.clickhouse.sql
  sql: "ctx-to-date-year-by-month-range-001.sql"
  row_order: "any"
  rows: "ctx-to-date-year-by-month-range-001.csv"
