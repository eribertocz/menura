id: ctx-prior-coarser-grain-001
rules: [E4-02, CTX-3.1, E4-8.6]
model: ctx-prior
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.order_date"]
    metrics:
      - {"metric": "sales_prior_month", "alias": "sales_prior_month"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "orders.order_date", "grain": "year"}]}}
expect:
  outcome: "error"
  error: "E4-02"
  location:
    document: "query"
    pointer: "/query/metrics/0"
