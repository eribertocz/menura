id: ctx-share-row-policy-001
rules: [CTX-3.3, E4-8.2]
model: ctx-share
security_context: analyst.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["orders.status"]
    metrics:
      - {"metric": "sales", "alias": "sales"}
      - {"metric": "sales_share_of_all", "alias": "sales_share_of_all"}
expect:
  outcome: "plan"
  sql_clickhouse: ctx-share-row-policy-001.clickhouse.sql
  tolerance: 1e-12
  row_order: "any"
  rows: "ctx-share-row-policy-001.csv"
