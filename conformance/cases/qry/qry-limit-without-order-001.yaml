id: qry-limit-without-order-001
rules: [QRY-4.6]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "limit": 2}}
expect:
  outcome: "error"
  error: "EQRY-04"
