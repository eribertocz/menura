id: qry-sql-bind-001
rules: [QRY-5.1, QRY-5.2, DEV-8, E2-3.3]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  sql: "SELECT UPPER(s.channel) AS c, AGG(s.total_amount) AS amount FROM slice.sales AS s WHERE sales.region = 'NORTH' GROUP BY UPPER(s.channel) ORDER BY c"
expect:
  outcome: "plan"
  row_order: "exact"
  rows: "qry-sql-bind-001.csv"
