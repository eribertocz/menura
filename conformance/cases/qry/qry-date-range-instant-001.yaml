id: qry-date-range-instant-001
rules: [QRY-4.2, E6-4.10]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "Asia/Tokyo"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "date_range": {"dimension": "sales.sold_at", "from": "2026-02-01", "to": "2026-02-10"}}}
expect:
  outcome: "plan"
  rows: "qry-date-range-instant-001.csv"
  row_order: "any"
