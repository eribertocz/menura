id: qry-date-range-date-001
rules: [QRY-4.2]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.region"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "date_range": {"dimension": "sales.sale_date", "from": "2026-01-10", "to": "2026-02-14"}}}
expect:
  outcome: "plan"
  rows: "qry-date-range-date-001.csv"
  row_order: "any"
