id: qry-paths-not-chained-001
rules: [QRY-4.3]
model: slice
security_context: manager.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["returns.sale_id"]
    metrics:
      - {"metric": "total_target", "alias": "total_target"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "paths": [{"from": "returns", "to": "targets", "relationships": ["sales_targets", "returns_sales"]}]}}
expect:
  outcome: "error"
  error: "EQRY-12"
  location:
    document: "query"
    pointer: "/query/nonportable_extensions/0/data/paths/0"
