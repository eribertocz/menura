id: e6-date-grain-001
rules: [E6-5.2, QRY-4.1]
model: slice
security_context: auditor.json
query:
  contract: "menura.query"
  contract_version: "1.1.0"
  time_zone: "UTC"
  query:
    dimensions: ["sales.sale_date"]
    metrics:
      - {"metric": "sale_count", "alias": "sale_count"}
    nonportable_extensions:
      - {"vendor_name": "COMMON", "data": {"namespace": "menura", "version": 1, "time_grains": [{"dimension": "sales.sale_date", "grain": "week"}]}}
expect:
  outcome: "plan"
  rows: "e6-date-grain-001.csv"
  row_order: "any"
