version: "0.1.1"
semantic_model:
  - name: e0_diagnostic_order
    description: Model with two datasets of the same name (E0.d) before a metric extension with an unknown key (E0.c)
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "semantic_compiler", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: orders
        source: shop.main.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: order_id}]}
          - name: amount
            expression: {dialects: [{dialect: ANSI_SQL, expression: amount}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: orders
        source: shop.main.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: order_id}]}
          - name: status
            expression: {dialects: [{dialect: ANSI_SQL, expression: status}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
    metrics:
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: SUM(orders.amount)}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "owner": "sales"}'
