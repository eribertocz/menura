version: "0.3.0.dev0"
name: e0_derived_development
description: Development-line model whose on_division_by_zero is an unquoted YAML null, not the string null
datasets:
  - name: invoices
    source: shop.main.invoices
    primary_key: [invoice_id]
    fields:
      - name: invoice_id
        expression: {sql: invoice_id}
      - name: customer_id
        expression: {sql: customer_id}
      - name: billed
        expression: {sql: billed}
      - name: collected
        expression: {sql: collected}
  - name: customers
    source: shop.main.customers
    primary_key: [customer_id]
    fields:
      - name: customer_id
        expression: {sql: customer_id}
      - name: region
        expression: {sql: region}
relationships:
  - name: invoices_customers
    from: invoices
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
metrics:
  - name: billed
    expression: {sql: 'SUM(invoices.billed)'}
  - name: collected
    expression: {sql: 'SUM(invoices.collected)'}
  - name: collection_rate
    expression: {sql: AGG(collected) / AGG(billed)}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: menura, version: 1, derived: {on_division_by_zero: null}}
  - name: uncollected_rate
    expression: {sql: '1 - AGG(collection_rate)'}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: menura, version: 1, derived: {}}
  - name: customer_count
    expression: {sql: 'COUNT(DISTINCT customers.customer_id)'}
  - name: billed_per_customer
    expression: {sql: 'AGG(billed) / AGG(customer_count)'}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: menura, version: 1, derived: {on_division_by_zero: error}}
