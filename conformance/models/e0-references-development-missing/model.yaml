version: "0.3.0.dev0"
name: e0_references_development_missing
description: Development-line model with sql expressions and dataset metrics that read fields and source columns, with missing references, each making its element unusable, and keys that resolve to source columns
nonportable_extensions:
  - vendor_name: COMMON
    data: {namespace: semantic_compiler, version: 1, security_context: {roles: [analyst], attributes: []}}
datasets:
  - name: orders
    source: shop.main.orders
    primary_key: [order_id]
    fields:
      - name: order_id
        expression: {sql: order_id}
      - name: customer_id
        expression: {sql: customer_id}
      - name: status
        expression: {sql: status}
      - name: amount
        expression: {sql: amount}
      - name: discount
        expression: {sql: discount}
    metrics:
      - name: amount_sum
        expression: {sql: SUM(amount)}
      - name: total_tax
        expression: {sql: SUM(tax)}
      - name: total_source_discount
        expression: {sql: SUM(source.discount)}
      - name: total_source_amount
        expression: {sql: SUM(SOURCE.amount)}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: semantic_compiler, version: 1, access: {mode: roles, roles: [analyst]}}
  - name: customers
    source: shop.main.customers
    primary_key: [customer_id]
    fields:
      - name: customer_name
        expression: {sql: name}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: semantic_compiler, version: 1, access: {mode: roles, roles: [analyst]}}
  - name: labels
    source: shop.main.labels
    primary_key: [name]
    fields:
      - name: label_id
        expression: {sql: label_id}
      - name: name
        expression: {sql: UPPER(name)}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: semantic_compiler, version: 1, access: {mode: roles, roles: [analyst]}}
relationships:
  - name: orders_customers
    from: orders
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
  - name: orders_clients
    from: orders
    to: clients
    from_columns: [customer_id]
    to_columns: [customer_id]
  - name: orders_customers_by_client
    from: orders
    to: customers
    from_columns: [client_id]
    to_columns: [customer_id]
metrics:
  - name: total_amount
    expression: {sql: SUM(orders.amount)}
  - name: total_missing_field
    expression: {sql: SUM(orders.tax)}
  - name: total_missing_dataset
    expression: {sql: SUM(refunds.amount)}
