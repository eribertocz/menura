version: "0.3.0.dev0"
name: e0_additivity_development
description: Development-line model whose dataset metric on customers declares over and entity that its own dataset does not reach
datasets:
  - name: debt
    source: shop.main.debt
    primary_key: [customer_id, period]
    fields:
      - name: customer_id
        expression: {sql: customer_id}
      - name: period
        expression: {sql: period}
      - name: balance
        expression: {sql: balance}
    metrics:
      - name: debt_balance
        expression: {sql: SUM(balance)}
        nonportable_extensions:
          - vendor_name: COMMON
            data: {namespace: semantic_compiler, version: 1, additivity: {type: semi_additive, over: debt.period, entity: [debt.customer_id], aggregation: last, selection: global_period, snapshot_grain: month, population: active_customers, missing: carry_forward, max_carry_forward: 2, on_stale: error, unexpected: exclude, nulls: as_missing}}
  - name: customers
    source: shop.main.customers
    primary_key: [customer_id]
    fields:
      - name: customer_id
        expression: {sql: customer_id}
      - name: category
        expression: {sql: category}
      - name: valid_from
        expression: {sql: valid_from}
      - name: valid_to
        expression: {sql: valid_to}
    nonportable_extensions:
      - vendor_name: COMMON
        data: {namespace: semantic_compiler, version: 1, populations: [{name: active_customers, mode: validity, entity: [customer_id], valid_from: valid_from, valid_to: valid_to, partial_period: any_day}]}
    metrics:
      - name: customer_snapshot
        expression: {sql: COUNT(*)}
        nonportable_extensions:
          - vendor_name: COMMON
            data: {namespace: semantic_compiler, version: 1, additivity: {type: semi_additive, over: debt.period, entity: [debt.customer_id], aggregation: last, selection: global_period, snapshot_grain: month, population: active_customers, missing: carry_forward, max_carry_forward: 2, on_stale: error, unexpected: exclude, nulls: as_missing}}
relationships:
  - name: debt_customers
    from: debt
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
