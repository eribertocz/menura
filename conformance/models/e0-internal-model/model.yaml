version: "0.1.1"
semantic_model:
  - name: e0_internal_model
    description: 'Orders and customers, with an unusable field and an unusable relationship'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: orders
        source: shop.main.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'order_id'}]}
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: status
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'status'}]}
          - name: amount
            description: 'Order amount'
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'amount'}]}
          - name: discount
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'no_such_column'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: customers
        source: shop.main.customers
        primary_key: [customer_id]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: region
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'region'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
    relationships:
      - name: orders_customer
        from: orders
        to: customers
        from_columns: [customer_id]
        to_columns: [customer_id]
      - name: orders_status_customer
        from: orders
        to: customers
        from_columns: [status]
        to_columns: [customer_id]
    metrics:
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.amount)'}]}
      - name: total_discount
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.discount)'}]}
      - name: net_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.amount) - SUM(orders.discount) - SUM(orders.rebate)'}]}
