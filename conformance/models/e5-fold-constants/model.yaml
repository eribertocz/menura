version: "0.1.1"
semantic_model:
  - name: e5_fold_constants
    description: 'Orders joined to customers, both with role-scoped row policies, for E5-3.6'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["clerk", "guest", "manager"], "attributes": []}}'
    datasets:
      - name: orders
        source: shop.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'order_id'}]}
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: amount
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'amount'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["clerk", "guest", "manager"]}, "row_access": [{"name": "staff_scope", "condition": "amount >= 0", "roles": ["clerk", "manager"]}]}'
      - name: customers
        source: shop.customers
        primary_key: [customer_id]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: segment
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'segment'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["clerk", "guest", "manager"]}, "row_access": [{"name": "manager_scope", "condition": "segment IS NOT NULL", "roles": ["manager"]}]}'
    relationships:
      - name: orders_customers
        from: orders
        to: customers
        from_columns: [customer_id]
        to_columns: [customer_id]
    metrics:
      - name: order_count
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'COUNT(orders.order_id)'}]}
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.amount)'}]}
