version: "0.1.1"
dialects: [ANSI_SQL, SNOWFLAKE, DATABRICKS]
vendors: [COMMON, DBT]
semantic_model:
  - name: e0_structure_variants
    description: Model with open ai_context objects, root dialect and vendor lists, a variant in another dialect and a field without an ANSI_SQL variant
    ai_context:
      instructions: Orders and balances of the shop
      owner: data-team
      review: {cadence: monthly}
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "semantic_compiler", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: orders
        source: shop.main.orders
        primary_key: [order_id]
        ai_context:
          synonyms: [purchases]
          steward: sales
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: order_id}]}
          - name: status
            expression:
              dialects:
                - {dialect: ANSI_SQL, expression: status}
                - {dialect: SNOWFLAKE, expression: status}
          - name: amount
            expression: {dialects: [{dialect: ANSI_SQL, expression: amount}]}
          - name: status_code
            expression:
              dialects:
                - {dialect: SNOWFLAKE, expression: "LEFT(status, 1)"}
                - {dialect: DATABRICKS, expression: "LEFT(status, 1)"}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: balances
        source: shop.main.balances
        primary_key: [branch, customer_id]
        fields:
          - name: branch
            expression: {dialects: [{dialect: ANSI_SQL, expression: branch}]}
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: customer_id}]}
          - name: balance
            expression: {dialects: [{dialect: ANSI_SQL, expression: balance}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
    metrics:
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: SUM(orders.amount)}]}
      - name: total_balance
        expression: {dialects: [{dialect: ANSI_SQL, expression: SUM(balances.balance)}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "semantic_compiler", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.branch", "entity": ["balances.customer_id"], "aggregation": "max", "nulls": "error"}}'
