version: "0.1.1"
semantic_model:
  - name: add_carried_null_unexpected_error
    description: 'A carried NULL balance and an unexpected entity, under nulls: error, carry_forward and unexpected: error'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: balances
        source: shop.balances
        primary_key: [customer_id, period]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: period
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'period'}]}
            dimension: {is_time: true}
          - name: balance
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'balance'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: members
        source: shop.members
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: valid_from
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'valid_from'}]}
            dimension: {is_time: true}
          - name: valid_to
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'valid_to'}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}, "populations": [{"name": "active_members", "mode": "validity", "entity": ["customer_id"], "valid_from": "valid_from", "valid_to": "valid_to", "partial_period": "any_day"}]}'
    metrics:
      - name: carried_null_error
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "carry_forward", "max_carry_forward": 4, "on_stale": "error", "unexpected": "error", "nulls": "error"}}'
