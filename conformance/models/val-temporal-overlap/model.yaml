version: "0.1.1"
semantic_model:
  - name: val_temporal_overlap
    description: 'Visits joined to the customer tier valid at their instant (VAL-2): an inclusive timestamp history whose two versions share one instant and whose last version is open-ended by NULL'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: visits
        source: shop.visits
        primary_key: [visit_id]
        fields:
          - name: visit_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: visit_id}]}
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: customer_id}]}
          - name: visited_at
            expression: {dialects: [{dialect: ANSI_SQL, expression: visited_at}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: customer_tiers
        source: shop.customer_tiers
        primary_key: [customer_id, tier_from]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: customer_id}]}
          - name: tier
            expression: {dialects: [{dialect: ANSI_SQL, expression: tier}]}
          - name: tier_from
            expression: {dialects: [{dialect: ANSI_SQL, expression: tier_from}]}
            dimension: {is_time: true}
          - name: tier_to
            expression: {dialects: [{dialect: ANSI_SQL, expression: tier_to}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}, "populations": [{"name": "tier_history", "mode": "validity", "entity": ["customer_id"], "valid_from": "tier_from", "valid_to": "tier_to", "partial_period": "any_day"}]}'
    relationships:
      - name: visit_tier
        from: visits
        to: customer_tiers
        from_columns: [customer_id]
        to_columns: [customer_id]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "temporal": {"from_time": "visited_at", "population": "tier_history"}}'
    metrics:
      - name: visit_count
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'COUNT(visits.visit_id)'}]}
