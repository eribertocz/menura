version: "0.1.1"
semantic_model:
  - name: val_2_3_population_001
    description: 'A temporal population that is a periodic population of customer_versions (E0C-68)'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: sales
        source: shop.sales
        primary_key: [sale_id]
        fields:
          - name: sale_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: sale_id}]}
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: customer_id}]}
          - name: sold_on
            expression: {dialects: [{dialect: ANSI_SQL, expression: sold_on}]}
            dimension: {is_time: true}
          - name: sold_at
            expression: {dialects: [{dialect: ANSI_SQL, expression: sold_at}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: customer_versions
        source: shop.customer_versions
        primary_key: [customer_id, valid_from]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: customer_id}]}
          - name: segment
            expression: {dialects: [{dialect: ANSI_SQL, expression: segment}]}
          - name: valid_from
            expression: {dialects: [{dialect: ANSI_SQL, expression: valid_from}]}
            dimension: {is_time: true}
          - name: valid_to
            expression: {dialects: [{dialect: ANSI_SQL, expression: valid_to}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}, "populations": [{"name": "customer_history", "mode": "validity", "entity": ["customer_id"], "valid_from": "valid_from", "valid_to": "valid_to", "partial_period": "any_day", "valid_to_bound": "exclusive"}, {"name": "monthly_customers", "mode": "periodic", "entity": ["customer_id"], "period": "valid_from", "grain": "month"}]}'
    relationships:
      - name: sale_customer
        from: sales
        to: customer_versions
        from_columns: [customer_id]
        to_columns: [customer_id]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "temporal": {"from_time": "sold_on", "population": "monthly_customers"}}'
    metrics:
      - name: sale_count
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'COUNT(sales.sale_id)'}]}
