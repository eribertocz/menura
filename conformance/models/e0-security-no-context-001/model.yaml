version: "0.1.1"
semantic_model:
  - name: e0_security
    description: 'No security_context: no roles or attributes are declared'
    datasets:
      - name: orders
        source: shop.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'order_id'}]}
          - name: region
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'region'}]}
          - name: amount
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'amount'}]}
          - name: unit_cost
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'unit_cost'}]}
          - name: cost_copy
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'unit_cost'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "authenticated"}}'
      - name: notes
        source: shop.notes
        primary_key: [note_id]
        fields:
          - name: note_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'note_id'}]}
          - name: body
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'body'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "authenticated"}}'
    metrics:
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.amount)'}]}
      - name: total_cost
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(orders.cost_copy)'}]}
      - name: note_count
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'COUNT(notes.note_id)'}]}
