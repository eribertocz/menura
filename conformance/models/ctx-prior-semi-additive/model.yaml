version: "0.1.1"
semantic_model:
  - name: ctx_prior_semi_additive
    description: 'A prior_period metric over a semi-additive base whose over is its time dimension (E4-8.4, E4-7.5): balances by customer and month'
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: balances
        source: shop.balances
        primary_key: [customer_id, period]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: period
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'period'}]}
            dimension: {is_time: true}
          - name: balance
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'balance'}]}
          - name: paid
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'paid'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: customers
        source: shop.customers
        primary_key: [customer_id]
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: category
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'category'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
      - name: members
        source: shop.members
        fields:
          - name: customer_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'customer_id'}]}
          - name: valid_from
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'valid_from'}]}
            dimension: {is_time: true}
          - name: valid_to
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'valid_to'}]}
            dimension: {is_time: true}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}, "populations": [{"name": "active_members", "mode": "validity", "entity": ["customer_id"], "valid_from": "valid_from", "valid_to": "valid_to", "partial_period": "any_day"}]}'
      - name: stock
        source: shop.stock
        primary_key: [warehouse, product]
        fields:
          - name: warehouse
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'warehouse'}]}
          - name: product
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'product'}]}
          - name: quantity
            expression: {dialects: [{dialect: ANSI_SQL, expression: 'quantity'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
    relationships:
      - name: balances_customers
        from: balances
        to: customers
        from_columns: [customer_id]
        to_columns: [customer_id]
    metrics:
      - name: last_global
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: last_per_entity
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "per_entity", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: first_global
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "first", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: first_per_entity
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "first", "selection": "per_entity", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: average_balance
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "avg", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: average_with_zero
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "avg", "snapshot_grain": "month", "population": "active_members", "missing": "zero", "unexpected": "exclude", "nulls": "keep"}}'
      - name: zero_minimum
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'MIN(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "zero", "unexpected": "exclude", "nulls": "keep"}}'
      - name: carried_balance
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "carry_forward", "max_carry_forward": 4, "on_stale": "error", "unexpected": "exclude", "nulls": "keep"}}'
      - name: stale_excluded
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "carry_forward", "max_carry_forward": 1, "on_stale": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: stale_error
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "carry_forward", "max_carry_forward": 1, "on_stale": "error", "unexpected": "exclude", "nulls": "keep"}}'
      - name: balance_and_count
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.balance) + COUNT(balances.paid)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "balances.period", "entity": ["balances.customer_id"], "aggregation": "last", "selection": "global_period", "snapshot_grain": "month", "population": "active_members", "missing": "exclude", "unexpected": "exclude", "nulls": "keep"}}'
      - name: total_paid
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(balances.paid)'}]}
      - name: peak_stock
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'SUM(stock.quantity)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "additivity": {"type": "semi_additive", "over": "stock.warehouse", "entity": ["stock.product"], "aggregation": "max", "nulls": "keep"}}'
      - name: average_balance_prior_month
        expression: {dialects: [{dialect: ANSI_SQL, expression: 'AGG(average_balance)'}]}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "context": {"base": "average_balance", "modifier": {"type": "prior_period", "time_dimension": "balances.period", "grain": "month", "offset": 1}}}'
