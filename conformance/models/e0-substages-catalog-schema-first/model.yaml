version: "0.1.1"
semantic_model:
  - name: e0_substages_catalog_schema_first
    description: Model with a field without an ANSI_SQL variant, read with a catalog schema of an unsupported contract version
    custom_extensions:
      - vendor_name: COMMON
        data: '{"namespace": "menura", "version": 1, "security_context": {"roles": ["analyst"], "attributes": []}}'
    datasets:
      - name: orders
        source: shop.main.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression: {dialects: [{dialect: ANSI_SQL, expression: order_id}]}
          - name: status
            expression: {dialects: [{dialect: ANSI_SQL, expression: status}]}
          - name: amount
            expression: {dialects: [{dialect: ANSI_SQL, expression: amount}]}
          - name: status_initial
            expression:
              dialects:
                - {dialect: SNOWFLAKE, expression: "LEFT(status, 1)"}
        custom_extensions:
          - vendor_name: COMMON
            data: '{"namespace": "menura", "version": 1, "access": {"mode": "roles", "roles": ["analyst"]}}'
    metrics:
      - name: total_amount
        expression: {dialects: [{dialect: ANSI_SQL, expression: SUM(orders.amount)}]}
