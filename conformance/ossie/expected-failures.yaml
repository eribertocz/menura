# Apache Ossie suite cases that do not pass yet (spec/04-ossie-conformance.md OSS-2.4).
#
# One entry per case, keyed `<suite>/<case folder>`. `reason` says why the case does not pass;
# `fixed_in` is the version expected to make it pass (spec/07-roadmap.md): Layer 3 suites block
# from 0.7.0 (OSS-2.3); the Layer 2 single-relation subset arrives in 0.5.0; joins, HAVING,
# CTEs, subqueries and set operators arrive after 1.0.0, one construct per release (F28).
# `issue` names the issue that will fix the case, once one exists.
# A stale list fails the build: an entry that names no vendored case (checked by every run), or a
# case that does not pass and is not listed (checked by `just conformance ossie`). Only the
# ossie-update skill changes this file (CS-3.2).

