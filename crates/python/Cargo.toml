[package]
name = "menura-python"
description = "Python package around the core, without compilation logic of its own (ARC-6.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "menura"
crate-type = ["cdylib"]

[dependencies]
menura-core.workspace = true
# ARC-6.3: approved by the maintainer on 2026-11-22, pinned to one version (#516).
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py310"] }
serde_json = "1"

[lints]
workspace = true
