[package]
name = "menura-conformance-runner"
description = "Test tooling (ARC-5.3): runs the conformance suite of spec/08-conformance-suite.md and reports results per rule ID."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "menura-conformance-runner"

[dependencies]
menura-contracts.workspace = true
menura-core.workspace = true
duckdb = { version = "=1.20000.2", default-features = false, features = ["download-lib"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = "2.1.1"
sha2 = { version = "0.10", default-features = false }

[features]
default = ["duckdb"]
# Executes every plan on DuckDB (E6-5.4). Without it the runner links no libduckdb: only the
# compile-only check, the wrapper parity check and the determinism check are built, for the
# `platforms` job (PLT-1.2).
duckdb = ["dep:duckdb"]

[[bin]]
name = "menura-conformance-runner"
path = "src/main.rs"
required-features = ["duckdb"]

[[bin]]
name = "conformance-clickhouse"
path = "src/bin/conformance-clickhouse.rs"
required-features = ["duckdb"]

# The integration tests that run cases or execute SQL need DuckDB.

[[test]]
name = "e0_cases"
path = "tests/e0_cases.rs"
required-features = ["duckdb"]

[[test]]
name = "integrity_check_execution"
path = "tests/integrity_check_execution.rs"
required-features = ["duckdb"]

[[test]]
name = "ossie_suites"
path = "tests/ossie_suites.rs"
required-features = ["duckdb"]

[[test]]
name = "output_expectations"
path = "tests/output_expectations.rs"
required-features = ["duckdb"]

[[test]]
name = "population_check_execution"
path = "tests/population_check_execution.rs"
required-features = ["duckdb"]

[[test]]
name = "query_cases"
path = "tests/query_cases.rs"
required-features = ["duckdb"]

[[test]]
name = "sample_cases"
path = "tests/sample_cases.rs"
required-features = ["duckdb"]

[[test]]
name = "summary_check_execution"
path = "tests/summary_check_execution.rs"
required-features = ["duckdb"]

[[test]]
name = "validity_check_execution"
path = "tests/validity_check_execution.rs"
required-features = ["duckdb"]

[lints]
workspace = true
