menura-core.workspace = true
duckdb = { version = "=1.20000.2", default-features = false, features = ["download-lib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1.1"

[lints]
workspace = true
