[package]
name = "menura-cli"
description = "Command-line wrapper around the core, without compilation logic of its own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "menura"
path = "src/main.rs"

# CON-0.5: the former name, an alias with the same arguments and results until 1.0.0.
[[bin]]
name = "semantic-compiler"
path = "src/alias.rs"

[dependencies]
menura-core.workspace = true

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
